<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --background: oklch(0.96 0 0);
    --foreground: oklch(0.145 0 0);
    --muted: oklch(0.485 0 0);
    --line: oklch(0.858 0 0);
    --hover: oklch(0.925 0 0);
    --active: oklch(0.89 0 0);
  }
  * { box-sizing: border-box; margin: 0; user-select: none; }
  html, body { background: transparent; }
  body {
    font: 12px/1.5 -apple-system, "SF Pro Text", sans-serif;
    letter-spacing: -0.01em;
    color: var(--foreground);
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    padding: 6px;
  }
  .island {
    -webkit-app-region: drag;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--background);
    border: 1px solid var(--line);
    box-shadow: 0 4px 16px oklch(0 0 0 / 0.12);
  }
  header { display: flex; align-items: baseline; gap: 8px; }
  .verdict { font-size: 13px; font-weight: 500; }
  .app {
    margin-left: auto; color: var(--muted); font-size: 11px; max-width: 110px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .detail {
    margin-top: 1px;
    color: var(--muted); font-size: 11px; min-height: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row {
    -webkit-app-region: no-drag;
    margin-top: 10px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  button {
    -webkit-app-region: no-drag;
    font: 500 11px/1 -apple-system, sans-serif;
    letter-spacing: -0.01em;
    color: var(--foreground);
    padding: 7px 4px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: transparent;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--hover); }
  button:active:not(:disabled) { background: var(--active); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.busy { border-color: var(--foreground); }
  .log {
    margin-top: auto;
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    min-height: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="island">
    <header>
      <div class="verdict" id="verdict">Starting</div>
      <div class="app" id="app"></div>
    </header>
    <div class="detail" id="detail"></div>
    <div class="row">
      <button data-act="insert">Insert</button>
      <button data-act="stream">Stream</button>
      <button data-act="scratch">Scratch</button>
      <button data-act="send">Send</button>
    </div>
    <div class="log" id="log"></div>
  </div>

<script>
  const verdict = document.getElementById('verdict')
  const appEl = document.getElementById('app')
  const detail = document.getElementById('detail')
  const logEl = document.getElementById('log')
  const buttons = [...document.querySelectorAll('button')]

  // What the island says tracks what the library concluded — the live classification is the
  // demo. Words carry the state; no colors, no indicators.
  const faces = {
    field: (s) =>
      s.field.surface === 'readable' ? 'Insertable, verified writes' : 'Insertable, paste only',
    'secure-field': () => 'Password field — refused',
    disabled: () => 'Disabled field',
    'not-a-field': (s) => `Not a field (${s.role})`,
    'no-element': () => 'Nothing focused',
    'no-permission': () => 'Grant Accessibility to this app',
    unsupported: () => 'macOS addon not built'
  }

  window.island.onState((state) => {
    const face = faces[state.status] ?? (() => state.status)
    verdict.textContent = state.secureInput ? 'Secure input active' : face(state)
    appEl.textContent = state.app ?? ''

    if (state.field) {
      const f = state.field
      const size = f.surface === 'readable' ? `${f.length} chars` : 'text unreadable'
      detail.textContent =
        `${f.kind}${f.multiline ? ', multiline' : ''}${f.readOnly ? ', read-only' : ''}` +
        `, ${size}${f.selected ? `, ${f.selected} selected` : ''}` +
        (f.label ? ` — ${f.label}` : '')
    } else {
      detail.textContent = ''
    }

    const usable = state.status === 'field' && !state.secureInput
    for (const button of buttons) {
      const needsReadable = ['stream', 'scratch'].includes(button.dataset.act)
      button.disabled = !usable || (needsReadable && state.field?.surface !== 'readable')
    }
  })

  window.island.onLog(({ text }) => {
    logEl.textContent = text
  })

  window.island.onActing((kind) => {
    for (const button of buttons) button.classList.toggle('busy', button.dataset.act === kind)
  })

  for (const button of buttons) {
    button.addEventListener('click', () => window.island.act(button.dataset.act))
  }
</script>
</body>
</html>
